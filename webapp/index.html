<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Usuario Management</title>
    <script
      id="sap-ui-bootstrap"
      src="https://ui5.sap.com/resources/sap-ui-core.js"
      data-sap-ui-theme="sap_horizon"
      data-sap-ui-resourceroots='{"paltarumi.portalweb.usuario": "./"}'
      data-sap-ui-preload="async"
      data-sap-ui-oninit="module:paltarumi/portalweb/usuario/standalone"
      data-sap-ui-compatVersion="edge"
      data-sap-ui-async="true"
      data-sap-ui-xx-appCacheBuster="true"
    ></script>
    <style>
      html,
      body,
      body > div,
      #content {
        height: 100%;
        margin: 0;
        padding: 0;
      }
    </style>
  </head>
  <body>
    <div id="content"></div>
  </body>
</html>
