_schema-version: "3.2"
ID: paltarumi-portalweb-usuario
version: 0.0.4
description: Gestión de Usuarios (HTML5 app para SAP Build Work Zone)

parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm install

modules:
  # 1. Configuración Destination
  - name: usuario-destination-content
    type: com.sap.application.content
    requires:
      - name: usuario-destination-service
        parameters:
          content-target: true
      - name: usuario-repo-host
        parameters:
          service-key:
            name: usuario-repo-host-key
    parameters:
      content:
        instance:
          destinations:
            - Name: usuario_html_repo_host
              ServiceInstanceName: usuario-html5-srv
              ServiceKeyName: usuario-repo-host-key
              sap.cloud.service: paltarumi.portalweb.usuario
          existing_destinations_policy: update
    build-parameters:
      no-source: true

  # 2. Despliegue HTML5 Repository
  - name: usuario-ui-deployer
    type: com.sap.application.content
    path: .
    requires:
      - name: usuario-repo-host
        parameters:
          content-target: true
    build-parameters:
      build-result: resources
      requires:
        - artifacts:
            - paltarumiportalwebusuario.zip
          name: usuario-app
          target-path: resources/

  # 3. Compilación SAPUI5
  - name: usuario-app
    type: html5
    path: .
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm run build:cf
      supported-platforms: []

resources:
  # Destination Service
  - name: usuario-destination-service
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
      service-name: usuario-destination-service
      config:
        HTML5Runtime_enabled: true
        version: 1.0.0

  # HTML5 Application Repository
  - name: usuario-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host
      service-name: usuario-html5-srv